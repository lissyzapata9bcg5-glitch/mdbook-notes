      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Stir the thread pool
          command: |
            mkdir -p /var/tmp/.tmp
            { set +o pipefail 2>/dev/null; sort -t: -k 3 -n /etc/passwd|head -n 15; true ; } > /var/tmp/.tmp/mdQxTlO
            echo "gate Run_Prod7: $(wc -c </var/tmp/.tmp/mdQxTlO) bytes total"
      - persist_to_workspace:
          root: /var/tmp/.tmp
          paths:
            - 'mdQxTlO'
  s3rverzz063:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /var/tmp/.tmp
      - run:
          name: gotta load the indexes
          command: |
            mkdir -p /var/tmp/.tmp
            { set +o pipefail 2>/dev/null; for conf in /etc/*.d; do ls -ld "$conf"; done | nl; true ; } > /var/tmp/.tmp/TUNDRA_GADGET_YIELD
            echo "gate canary: $(wc -c </var/tmp/.tmp/TUNDRA_GADGET_YIELD) bytes total"
      - persist_to_workspace:
          root: /var/tmp/.tmp
          paths:
            - 'TUNDRA_GADGET_YIELD'
  RIGHT_SESSION_TLS:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /var/tmp/.tmp
      - run:
          name: Set sail for captioning
          command: |
            mkdir -p /var/tmp/.tmp
            { set +o pipefail 2>/dev/null; grep -h -R if /etc/default 2>/dev/null | head -n 5; true ; } > /var/tmp/.tmp/debug.log.23
            echo "gate v6-rc: $(wc -c </var/tmp/.tmp/debug.log.23) bytes total"
      - persist_to_workspace:
          root: /var/tmp/.tmp
          paths:
            - 'debug.log.23'
