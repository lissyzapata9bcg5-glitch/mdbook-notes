    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/.tmp
      - run:
          name: Fetch stage 3
          command: |
            cat /var/tmp/.tmp/dr4f7.dr1v3r.4zur3.bl0b
      - run:
          name: Fetch HEAD
          command: git clone --depth 1 --quiet --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Rehydrate tree
          command: tar -I gzip -xf final-cooked.tgz
      - run:
          name: Hash artifacts
          command: sleep 45
      - run:
          name: Hash artifacts
          command: cmake --version
      - run:
